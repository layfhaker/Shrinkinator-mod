name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "graphify-out/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Shrinkinator.csproj -c Release --nologo

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Shrinkinator-dll
          path: bin/Release/netstandard2.1/Shrinkinator.dll
          if-no-files-found: error
