name: Publish to Thunderstore

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: thunderstore-publish
  cancel-in-progress: false

jobs:
  publish:
    # GreenTF/upload-thunderstore-package is a Docker container action (Linux only).
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Shrinkinator.csproj -c Release --nologo

      - name: Read version
        id: ver
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Shrinkinator.csproj | head -n1)
          if [ -z "$version" ]; then
            echo "Version missing in Shrinkinator.csproj" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Skip if Thunderstore already has this version
        id: skip
        run: |
          url="https://thunderstore.io/api/experimental/package/Avariiiprime/Shrinkinator/"
          if json=$(curl -fsSL -H "Accept: application/json" "$url"); then
            if echo "$json" | grep -q "\"version_number\":\"${{ steps.ver.outputs.version }}\""; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Version ${{ steps.ver.outputs.version }} already on Thunderstore — skip publish."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Could not query Thunderstore — will try to publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Thunderstore token
        id: token
        env:
          TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "THUNDERSTORE_TOKEN is not set. Add it in Settings → Secrets and variables → Actions."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage package files
        if: steps.skip.outputs.exists != 'true' && steps.token.outputs.has == 'true'
        run: |
          mkdir -p package
          cp bin/Release/netstandard2.1/Shrinkinator.dll package/
          cp thunderstore/icon.png package/icon.png
          cp README.md package/README.md
          cp CHANGELOG.md package/CHANGELOG.md

      - name: Upload to Thunderstore
        if: steps.skip.outputs.exists != 'true' && steps.token.outputs.has == 'true'
        id: ts
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          namespace: Avariiiprime
          name: Shrinkinator
          version: ${{ steps.ver.outputs.version }}
          description: "Ray gun that sprays green mist shrinking valuables, enemies, and players. Shrunk enemies are easier to grab."
          community: repo
          path: package
          website: ${{ github.server_url }}/${{ github.repository }}
          categories: |
            items
            weapons
            mods
          deps: BepInEx-BepInExPack@5.4.2100 Zehs-REPOLib@4.2.0

      - name: Tag and GitHub Release
        if: steps.skip.outputs.exists != 'true' && steps.token.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            git tag "$tag"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" bin/Release/netstandard2.1/Shrinkinator.dll --title "$tag" --notes-file CHANGELOG.md --latest
          fi
        continue-on-error: true
